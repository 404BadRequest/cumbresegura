name: CI/CD

on:
  pull_request:
    branches: [development]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t cumbresegura:ci .

      - name: Probar que el servicio responde
        run: |
          docker run -d --name cumbresegura-ci -p 8000:8000 cumbresegura:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs cumbresegura-ci
          exit 1

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t cumbresegura:release .

      - name: Publicar en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Sin VERCEL_TOKEN en los secretos. La publicación se hace con la CLI de Vercel."
            exit 0
          fi
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
